<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
</head>
<body>

    <h2>Login Form</h2>

    <form method="post" action="display.html">

        <div>
            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email" 
                required
            />
        </div>

        <br>

        <div>
            <label for="password">Password:</label>
            <input
                type="password"
                id="password"
                name="password"
                required
            />
        </div>

        <br>

        <div>
            <button type="submit">Log In</button>
            <button type="reset">Clear</button>
        </div>

    </form>

    <table>
        <thead>
            <th> Names</th>
            <th> Passwords</th>
        </thead>
        <tbody>
            <td>
                Dennis Ogweno
            </td>
            <td> Pass123</td>
        </tbody>
        <tfoot>
            <p>
                Passwords table
            </p>
        </tfoot>
    </table>

</body>
</html>
